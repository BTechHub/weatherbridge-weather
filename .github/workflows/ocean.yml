name: ocean-data

# Once a day, after Copernicus Marine publishes its daily global ocean forecast: surface currents and sea
# temperature for the marine answers. Needs the repository secrets WB_CMEMS_USERNAME and WB_CMEMS_PASSWORD
# (a free Copernicus Marine account) and WB_WEATHER_INGEST_TOKEN.
on:
  schedule:
    - cron: "20 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Upload again even if today's run is already live"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ocean-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WB_WEATHER_INGEST_URL: https://api.lorjova.com/weatherbridge/ingest/weather
      WB_WEATHER_INGEST_TOKEN: ${{ secrets.WB_WEATHER_INGEST_TOKEN }}
      WB_CMEMS_USERNAME: ${{ secrets.WB_CMEMS_USERNAME }}
      WB_CMEMS_PASSWORD: ${{ secrets.WB_CMEMS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt "copernicusmarine>=2.0,<3"
      - run: python -m unittest
      - run: python -m wbwx.ocean --out "$RUNNER_TEMP/ocean" --publish ${{ inputs.force && '--force' || '' }}
