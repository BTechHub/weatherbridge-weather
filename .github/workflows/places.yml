name: places

# Weekly: the app's place search list from GeoNames (CC BY 4.0), uploaded to the API.
on:
  schedule:
    - cron: "10 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WB_WEATHER_INGEST_URL: https://api.lorjova.com/weatherbridge/ingest/weather
      WB_WEATHER_INGEST_TOKEN: ${{ secrets.WB_WEATHER_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - run: python -m wbwx.places --out "$RUNNER_TEMP/places" --publish
      # Tells the admin page (api.lorjova.com/admin, Data jobs) how this run ended; never fails the run.
      - name: Report to the admin page
        if: ${{ always() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report() {
            curl -sS -m 20 -o /dev/null -w "report $1 $2: HTTP %{http_code}\n" -X POST https://api.lorjova.com/weatherbridge/ingest/report \
              -H "Authorization: Bearer $WB_WEATHER_INGEST_TOKEN" -H "Content-Type: application/json" \
              -d "{\"job\":\"$1\",\"result\":\"$2\",\"url\":\"$RUN_URL\"}" || echo "::warning::Could not report $1 to the admin page"
          }
          report places "${{ job.status }}"
