name: weather-data

# NOAA GFS and GFS-Wave runs start at 00, 06, 12 and 18 UTC and are complete on AWS about 4 h 15 min later.
on:
  schedule:
    - cron: "35 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish the newest cycle again even if it is already live (after a fix)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # keep-alive below

concurrency:
  group: weather-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WB_WEATHER_INGEST_URL: https://api.lorjova.com/weatherbridge/ingest/weather
      WB_WEATHER_INGEST_TOKEN: ${{ secrets.WB_WEATHER_INGEST_TOKEN }}
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - name: GFS (forecast)
        id: gfs
        run: python -m wbwx.job gfs --out "$RUNNER_TEMP/build" --publish $FORCE
      - name: GFS-Wave (marine)
        id: gfswave
        if: ${{ !cancelled() }}
        run: rm -rf "$RUNNER_TEMP/build" && python -m wbwx.job gfswave --out "$RUNNER_TEMP/build" --publish $FORCE
      # Tells the admin page (api.lorjova.com/admin, Data jobs) how this run ended; never fails the run.
      - name: Report to the admin page
        if: ${{ always() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report() {
            curl -sS -m 20 -o /dev/null -w "report $1 $2: HTTP %{http_code}\n" -X POST https://api.lorjova.com/weatherbridge/ingest/report \
              -H "Authorization: Bearer $WB_WEATHER_INGEST_TOKEN" -H "Content-Type: application/json" \
              -d "{\"job\":\"$1\",\"result\":\"$2\",\"url\":\"$RUN_URL\"}" || echo "::warning::Could not report $1 to the admin page"
          }
          # A step skipped because setup failed counts as the job's failure.
          report forecast "${{ steps.gfs.outcome == 'skipped' && job.status || steps.gfs.outcome }}"
          report marine "${{ steps.gfswave.outcome == 'skipped' && job.status || steps.gfswave.outcome }}"
      # GitHub pauses scheduled workflows in a repo with no activity for 60 days; re-enabling keeps it running.
      - name: Keep the schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weather.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ocean.yml/enable"
      # Fails the run (GitHub then emails) if the API is not serving a fresh run of both datasets.
      - name: Check the API is up to date
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS https://api.lorjova.com/weatherbridge/v1/status; then echo; exit 0; fi
            sleep 60
          done
          echo "::error::api.lorjova.com/weatherbridge/v1/status is stale or down"
          exit 1
